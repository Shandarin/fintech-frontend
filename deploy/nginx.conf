server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # The mock frontend has NO real API. Do not return index.html as fake API data.
    location ^~ /api/ {
        default_type application/json;
        return 501 '{"error":{"code":"BACKEND_NOT_CONNECTED","message":"This frontend preview has no backend."}}';
    }
    location = /graphql {
        default_type application/json;
        return 501 '{"error":{"code":"BACKEND_NOT_CONNECTED"}}';
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
