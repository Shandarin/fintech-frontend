# Run alongside the backend Compose project on the existing backend network.
services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
    networks: [default, market]
    ports: ["127.0.0.1:3000:80"]
    volumes:
      - ./nginx.replay.conf:/etc/nginx/conf.d/default.conf:ro
networks:
  market:
    external: true
    name: financetech_internal
  default:
    external: true
    name: ${REPLAY_NETWORK:-hs300-replay_internal}
